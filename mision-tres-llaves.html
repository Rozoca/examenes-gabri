<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Las tres llaves · El Rincón de Gabri</title><meta name="description" content="Una misión de 20 retos de Lengua, Matemáticas y los visigodos para 5º de Primaria."><style>
:root{color-scheme:dark;--bg:#101736;--panel:#1b2350;--text:#f2f7ff;--muted:#c6d0f2;--gold:#ffc85c;--mint:#4adca5;--line:#52608d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#3a2e77,transparent 60%),var(--bg);font:18px/1.6 system-ui,sans-serif;color:var(--text);min-height:100vh}main{max-width:820px;margin:auto;padding:24px 20px 60px}nav,.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}a{color:#6fe0f2}nav{font-size:14px;margin-bottom:28px}h1{font-size:clamp(36px,7vw,60px);line-height:1.06;letter-spacing:-2px;margin:15px 0}h2{font-size:clamp(24px,4vw,32px);line-height:1.3;margin:12px 0 20px}p{margin:12px 0}.muted{color:var(--muted)}.eyebrow{font-size:13px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);font-weight:800}.panel{background:var(--panel);border:1px solid var(--line);padding:clamp(20px,4vw,34px);border-radius:24px;margin:20px 0}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:28px 0}.map>div{border:1px solid var(--line);border-radius:16px;padding:16px 10px;font-size:14px;text-align:center}.map b{display:block;font-size:30px}.map .active{border-color:var(--gold);background:#ffc85c16}button,.button{font:700 17px/1.4 system-ui;cursor:pointer;border-radius:12px;border:1px solid var(--line);padding:14px 20px;background:#263364;color:var(--text);min-height:48px;text-decoration:none;display:inline-block}button:hover,.button:hover{border-color:var(--gold)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:4px}.primary{background:var(--gold);color:#231a09;border:0}.options{display:grid;gap:10px}.option{text-align:left;width:100%}.option[aria-pressed=true]{border:2px solid var(--gold);background:#45415b}.option:disabled{opacity:1;cursor:default}.correct{border-color:var(--mint)!important;background:#163e39!important}.wrong{border-color:#ff8fb1!important}.feedback{padding:18px;border-radius:14px;background:#101736;border-left:4px solid var(--mint);margin:20px 0}.context{background:#101736;padding:20px;border-radius:16px;margin:15px 0;white-space:pre-line}progress{width:100%;height:14px;accent-color:var(--mint)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}details{font-size:16px;margin-top:18px;color:var(--muted)}summary{cursor:pointer}input[type=text],textarea{display:block;width:100%;padding:14px;background:#101736;border:1px solid var(--line);border-radius:12px;color:white;font:inherit;margin:10px 0}textarea{min-height:160px;resize:vertical}.check{display:block;margin:14px 0}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;accent-color:var(--mint)}.small{font-size:14px}.badge{color:var(--gold);font-weight:800}.diagram{display:block;width:100%;max-width:340px;height:150px;margin:14px auto} [hidden]{display:none!important}@media(max-width:420px){main{padding:18px 12px}.map{gap:5px}.map>div{padding:12px 5px;font-size:12px}button{padding:13px 14px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><main><nav><a href="index.html">← El Rincón de Gabri</a><span>5º · Misión de repaso</span></nav><div id="app"></div><p id="storage" class="small muted" role="status"></p></main><script>
'use strict';
const Q=[
{area:0,tag:'Detective de historias',q:'¿Qué tipo de texto es este?',text:'Cuentan en un pueblo de la sierra que una dragona duerme bajo el monte. Cuando bosteza, la niebla cubre las casas. Los abuelos llevan generaciones contando esta historia para explicar la niebla.',a:['Una anécdota real','Una leyenda','Una noticia'],c:1,h:'Busca una tradición que mezcla un lugar real con elementos fantásticos.',e:'Es una leyenda: se transmite como tradición y mezcla elementos reales y fantásticos. Un cuento también narra una historia, pero no necesita presentarse como tradición de un lugar.'},
{area:0,tag:'Lo importante',q:'¿Cuál es la idea principal?',text:'Al llegar al bosque, Leo encontró basura junto al río. Llamó a sus amigos y juntos limpiaron la orilla. Después pusieron un cartel para recordar a los visitantes que cuidaran el lugar.',a:['Leo tiene muchos amigos.','Había un cartel en el bosque.','Un grupo colabora para cuidar el río.'],c:2,h:'Elige la idea que resume todo lo que ocurre, no solo un detalle.',e:'Limpiar juntos y animar a cuidar el río resume el texto completo.'},
{area:0,tag:'Palabras con nombre',q:'¿Cuál es el análisis correcto de «bibliotecas»?',a:['Común, concreto, individual, contable, femenino y plural.','Propio, concreto, colectivo, femenino y plural.','Común, abstracto, individual, masculino y singular.'],c:0,h:'¿Nombra algo que puedes percibir? ¿Una biblioteca nombra un grupo de bibliotecas?',e:'Bibliotecas es común, concreto, individual, contable, femenino y plural. Estar en plural no convierte un sustantivo en colectivo.'},
{area:0,tag:'Un nombre, un grupo',q:'¿Qué sustantivo es colectivo?',a:['Árboles','Bosque','Alegría'],c:1,h:'Un colectivo nombra un conjunto aunque esté en singular.',e:'Bosque es colectivo porque nombra un conjunto de árboles. Árboles es individual en plural; alegría es abstracto.'},
{area:0,tag:'Taller de puntuación',q:'¿Qué mensaje está escrito correctamente?',a:['el sábado, iremos a toledo llevaremos agua fruta y pan','El sábado iremos a Toledo. Llevaremos agua, fruta y pan.','El Sábado iremos a toledo. Llevaremos, agua fruta y pan.'],c:1,h:'Mayúscula al empezar y en nombres propios. Comas para separar elementos de una lista.',e:'Toledo es un nombre propio. Sábado se escribe con minúscula. El punto separa las oraciones y las comas ordenan la enumeración.'},
{area:0,tag:'Una palabra nueva',q:'En «La exploradora fue tenaz: lo intentó varias veces sin rendirse», ¿qué significa tenaz?',a:['Que se rinde enseguida','Que tiene mucho sueño','Que persevera para conseguir algo'],c:2,h:'El resto de la frase te da la pista.',e:'Tenaz significa que mantiene su esfuerzo. Es una palabra de práctica; no sustituye la lista de vocabulario de tu clase.'},
{area:0,tag:'¿Real o inventado?',q:'«Ayer, en el recreo, fui a chutar y se me salió la zapatilla. ¡Todos nos reímos!». Si cuentas algo que te ocurrió de verdad, es…',a:['Una anécdota','Una leyenda','Un cuento fantástico'],c:0,h:'Es un suceso breve, real y curioso de tu vida.',e:'Una anécdota cuenta un hecho real, breve y curioso. En esta clasificación escolar es un texto no literario; el cuento y la leyenda son literarios.'},
{area:0,tag:'Tu minihistoria',q:'Escribe una anécdota real en 3 o 4 frases.',type:'write',text:'Cuenta algo curioso que te haya pasado. Incluye dónde ocurrió, qué pasó y cómo terminó. Usa una enumeración, por ejemplo: «Llevaba agua, fruta y una gorra».',h:'Puedes empezar: «El otro día estaba en…». Tu texto se queda en este navegador.',e:'Esta actividad necesita revisión humana: no se califica automáticamente. Lee tu texto en voz alta y revísalo con un adulto.'},
{area:1,tag:'El tamaño de las cosas',q:'¿Qué pareja de medidas es razonable?',a:['Una jirafa: 5 cm; un clip: 1 kg.','Una jirafa: 5 km; un clip: 1 t.','Una jirafa: 5 m; un clip: 1 g.'],c:2,h:'Imagina ambos objetos delante de ti.',e:'Una jirafa puede medir unos 5 metros. Un clip pesa aproximadamente 1 gramo: usamos unidades adecuadas al tamaño o masa.'},
{area:1,tag:'Puente de centímetros',q:'El camino de bloques mide 350 cm. ¿Cuántos metros son?',type:'number',answer:3.5,unit:'m',h:'100 cm = 1 m. Para pasar de centímetros a metros, divide entre 100.',e:'350 ÷ 100 = 3,5 m. Puedes escribir decimales con coma o con punto.'},
{area:1,tag:'Ruta del explorador',q:'Has recorrido 2 km y otros 450 m. ¿Cuántos metros has recorrido en total?',type:'number',answer:2450,unit:'m',h:'Primero convierte los kilómetros: 1 km = 1.000 m.',e:'2 km = 2.000 m; 2.000 + 450 = 2.450 m.'},
{area:1,tag:'El mapa del tesoro',q:'A escala 1:5.000, un camino mide 3 cm en el mapa. ¿Cuántos metros mide en realidad?',type:'number',answer:150,unit:'m',graphic:'map',h:'Multiplica 3 × 5.000 para obtener centímetros reales. Después divide entre 100.',e:'3 × 5.000 = 15.000 cm. Al dividir entre 100, obtenemos 150 m. Recuerda: 15.000 cm no son 15 m.'},
{area:1,tag:'La muralla hexagonal',q:'Una muralla tiene forma de hexágono regular y un perímetro de 24 m. ¿Cuánto mide cada lado?',type:'number',answer:4,unit:'m',graphic:'hex',h:'Un hexágono regular tiene 6 lados iguales. Reparte el perímetro entre ellos.',e:'24 ÷ 6 = 4 m por lado. Para comprobarlo: 6 × 4 = 24 m.'},
{area:1,tag:'El giro de la puerta',q:'La puerta gira 90° y luego otros 40° en el mismo sentido. ¿Qué ángulo forma en total?',a:['50°, agudo','130°, obtuso','180°, llano'],c:1,h:'Suma los giros. Un ángulo obtuso mide más de 90° y menos de 180°.',e:'90° + 40° = 130°: obtuso. Agudo: menos de 90°; recto: 90°; llano: 180°.'},
{area:2,tag:'Viaje al pasado',q:'¿Qué ocurrió en el año 476 d. C.?',a:['Cayó el Imperio romano de Occidente; se sitúa ahí el inicio de la Edad Media.','Se libró la batalla de Guadalete.','Recaredo unificó la religión del reino.'],c:0,h:'Es el cambio de etapa histórica con el que empieza el tema.',e:'En 476 cayó el Imperio romano de Occidente. Esa fecha se usa para marcar el comienzo de la Edad Media.'},
{area:2,tag:'Un reino organizado',q:'¿Qué descripción del reino visigodo coincide con tu presentación?',a:['Capital en Roma y provincias gobernadas por cónsules.','Capital en Toledo; un rey y ducados dirigidos por duques.','Capital en Córdoba y gobierno sin rey.'],c:1,h:'Recuerda la ciudad principal y la relación ducado → duque.',e:'La capital era Toledo. El rey gobernaba el reino y los duques dirigían los ducados. La presentación del tema describe cinco ducados.'},
{area:2,tag:'Tres reyes, tres decisiones',q:'¿Qué combinación es correcta?',a:['Leovigildo: leyes; Recaredo: territorio; Recesvinto: religión.','Leovigildo: religión; Recaredo: leyes; Recesvinto: territorio.','Leovigildo: territorio; Recaredo: religión; Recesvinto: leyes.'],c:2,h:'Recuerda el orden: territorio → religión → leyes.',e:'Leovigildo impulsó la unidad territorial; Recaredo, la unidad religiosa; Recesvinto, un código de leyes común.'},
{area:2,tag:'La vida cotidiana',q:'¿Qué afirmación describe la sociedad visigoda?',a:['Era desigual; rey, nobles y obispos eran privilegiados, y predominaban agricultura y ganadería.','Todos tenían los mismos privilegios y vivían del gran comercio.','Los campesinos elegían al rey y no había artesanos.'],c:0,h:'Piensa en la pirámide social de la presentación.',e:'Era una sociedad jerarquizada. Campesinos, artesanos y comerciantes no eran privilegiados. El comercio era escaso y también se practicaba el trueque.'},
{area:2,tag:'¿Quién elige al rey?',q:'¿Qué significa «monarquía electiva» en el reino visigodo?',a:['El hijo mayor heredaba siempre.','Los nobles elegían al rey, lo que podía provocar disputas por el poder.','Toda la población votaba al rey.'],c:1,h:'Electiva significa que alguien elige. ¿Quién tenía ese poder?',e:'Los nobles elegían al monarca. El trono no pasaba automáticamente al hijo del rey y podían surgir enfrentamientos.'},
{area:2,tag:'La última puerta',q:'¿Qué ocurrió en 711 en la batalla de Guadalete?',a:['Los romanos fundaron Toledo.','Leovigildo derrotó a los suevos.','Un ejército musulmán derrotó al rey Rodrigo y comenzó el final del reino visigodo.'],c:2,h:'Relaciona 711 con Rodrigo y la llegada desde el norte de África.',e:'Tras cruzar el estrecho, los musulmanes derrotaron a Rodrigo en Guadalete. Después conquistaron gran parte de la península, que pasó a formar parte de al-Ándalus.'}
];
const areas=['Lengua','Matemáticas','Sociales'],icons=['📖','🧭','🏰'],key='gabri-tres-llaves-v1',app=document.getElementById('app');
let state={i:0,answers:[],draft:'',checks:[false,false,false],started:false},selected=null;
try{const s=JSON.parse(localStorage.getItem(key));if(s&&Number.isInteger(s.i)&&s.i>=0&&s.i<=20&&Array.isArray(s.answers)&&s.answers.length===s.i){state={...state,...s};}}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify(state));}catch{document.getElementById('storage').textContent='No se puede guardar en este navegador. Puedes seguir jugando mientras esta página permanezca abierta.';}}
function el(id){return document.getElementById(id)}
function bind(id,fn){const e=el(id);if(e)e.onclick=fn;}
function focus(){const e=el('title');if(e)e.focus();}
function map(active){return '<div class="map">'+areas.map((s,i)=>'<div class="'+(active===i?'active':'')+'"><b>'+icons[i]+'</b>'+s+' · '+[8,6,6][i]+' retos</div>').join('')+'</div>';}
function home(){app.innerHTML='<div class="eyebrow">Una aventura · Tres llaves</div><h1>El archivo<br>de los mundos perdidos.</h1><p class="muted">Gabri, las puertas del archivo están cerradas. Recupera las llaves de las palabras, los mapas y la historia.</p>'+map(-1)+'<section class="panel"><h2>20 retos. A tu ritmo.</h2><p>Una pregunta cada vez, pistas cuando las necesites y una pausa entre mundos. Sin cuenta atrás ni vidas que perder.</p><p class="small muted">Unos 20–25 minutos, o un bloque cada día. Tu progreso y tu texto se guardan solo en este navegador.</p><div class="actions"><button class="primary" id="go">'+(state.i===20?'Ver resultado':state.started?'Continuar · reto '+(state.i+1):'Abrir la primera puerta →')+'</button>'+(state.started?'<button id="reset">Empezar de nuevo</button>':'')+'</div></section><details><summary>Para acompañantes: contenidos y revisión</summary><p>8 actividades de Lengua (incluida una escritura guiada), 6 de Matemáticas y 6 de Sociales. Basado en el aviso escolar, las fichas de medidas, perímetros y ángulos y la presentación «Los visigodos · Viaje al pasado».</p><p>19 respuestas tienen corrección automática. La anécdota se revisa con un adulto y no cuenta como acierto automático. El vocabulario «tenaz» es práctica complementaria.</p><p>En la ficha de escala hay una errata: 15.000 cm equivalen a 150 m, no a 15 m. Aquí se utiliza la equivalencia correcta.</p></details>';bind('go',()=>{state.started=true;save();render();});bind('reset',reset);}
function reset(){app.innerHTML='<section class="panel"><h2>¿Volver a empezar?</h2><p>Se borrarán las respuestas y el texto guardados de esta misión.</p><div class="actions"><button id="yes">Sí, empezar de cero</button><button class="primary" id="no">Conservar mi progreso</button></div></section>';bind('yes',()=>{state={i:0,answers:[],draft:'',checks:[false,false,false],started:false};save();home();});bind('no',home);}
function graphic(t){if(t==='map')return '<svg class="diagram" viewBox="0 0 340 150" role="img" aria-label="Camino de 3 centímetros en un mapa a escala uno a cinco mil"><path d="M40 85H290" stroke="#ffc85c" stroke-width="6" stroke-dasharray="10 6"/><circle cx="40" cy="85" r="10" fill="#4adca5"/><path d="M280 65h22v22h-22z" fill="#b98cff"/><text x="170" y="48" text-anchor="middle" fill="white" font-size="20">3 cm en el mapa</text><text x="170" y="130" text-anchor="middle" fill="#ffc85c" font-size="17">Escala 1:5.000</text></svg>';if(t==='hex')return '<svg class="diagram" viewBox="0 0 340 150" role="img" aria-label="Hexágono regular con seis lados iguales y perímetro de 24 metros"><path d="M130 15H210L250 75 210 135H130L90 75Z" fill="#ffc85c18" stroke="#ffc85c" stroke-width="4"/><text x="170" y="82" text-anchor="middle" fill="white" font-size="20">P = 24 m</text></svg>';return '';}
function render(){if(state.i===20){finish();return;}const q=Q[state.i];selected=null;app.innerHTML='<div class="row"><span class="eyebrow">'+icons[q.area]+' '+areas[q.area]+'</span><button id="pause">Pausar</button></div>'+map(q.area)+'<label for="progress" class="small">Reto '+(state.i+1)+' de 20 · '+q.tag+'</label><progress id="progress" max="20" value="'+state.i+'"></progress><section class="panel"><h2 id="title" tabindex="-1">'+q.q+'</h2>'+(q.text?'<p class="context">'+q.text+'</p>':'')+graphic(q.graphic)+(q.type==='write'?'<label for="response">Tu anécdota</label><textarea id="response" maxlength="1500" placeholder="El otro día…"></textarea><p class="small muted">Antes de terminar, comprueba:</p><label class="check"><input type="checkbox" id="c0"> He contado dónde ocurrió, qué pasó y el final.</label><label class="check"><input type="checkbox" id="c1"> He usado mayúsculas y puntos.</label><label class="check"><input type="checkbox" id="c2"> He incluido una lista con comas.</label>':q.type==='number'?'<label for="response">Tu respuesta en '+q.unit+' (solo el número)</label><input id="response" type="text" inputmode="decimal" autocomplete="off" placeholder="Escribe aquí">':'<div class="options">'+q.a.map((s,j)=>'<button class="option" data-choice="'+j+'" aria-pressed="false">'+s+'</button>').join('')+'</div>')+'<details><summary>💡 Necesito una pista</summary><p>'+q.h+'</p></details><div id="feedback" aria-live="polite"></div><div class="actions"><button class="primary" id="check">'+(q.type==='write'?'Guardar y revisar':'Comprobar')+'</button><button class="primary" id="next" hidden>Siguiente →</button></div></section>';bind('pause',home);if(q.type==='write'){el('response').value=state.draft;el('response').oninput=()=>{state.draft=el('response').value;save();};state.checks.forEach((v,j)=>{el('c'+j).checked=v;el('c'+j).onchange=()=>{state.checks[j]=el('c'+j).checked;save();};});}app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.choice);app.querySelectorAll('[data-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));});bind('check',check);focus();}
function numberValue(raw){let s=raw.trim().replace(/\s/g,'');if(!/^-?\d+(?:[.,]\d+)?$/.test(s))return NaN;return Number(s.replace(',','.'));}
function check(){const q=Q[state.i];let ok=null,value=null;if(q.type==='write'){value=el('response').value.trim();if(value.length<25||!state.checks.every(Boolean)){el('feedback').textContent='Escribe tu anécdota y revisa las tres casillas antes de continuar.';return;}}else if(q.type==='number'){value=numberValue(el('response').value);if(!Number.isFinite(value)){el('feedback').textContent='Escribe un número sin unidades. Usa coma o punto solo para decimales; por ejemplo: 3,5.';return;}ok=Math.abs(value-q.answer)<0.000001;}else{if(selected===null){el('feedback').textContent='Elige una respuesta antes de comprobar.';return;}value=selected;ok=selected===q.c;app.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;const j=Number(b.dataset.choice);if(j===q.c)b.classList.add('correct');if(j===selected&&!ok)b.classList.add('wrong');});}el('check').hidden=true;el('next').hidden=false;el('feedback').className='feedback';el('feedback').textContent=(ok===null?'✍️ Texto guardado. ':ok?'✅ ¡Lo has conseguido! ':'🔎 Vamos a entenderlo. ')+q.e;if(el('response'))el('response').disabled=true;[0,1,2].forEach(j=>{if(el('c'+j))el('c'+j).disabled=true;});bind('next',()=>{state.answers.push({ok,value});state.i++;save();if(state.i===8||state.i===14)pauseBlock();else render();});el('next').focus();}
function pauseBlock(){const a=Q[state.i-1].area;app.innerHTML='<section class="panel"><div class="eyebrow">Llave recuperada</div><h1>'+icons[a]+' '+areas[a]+' completada.</h1><p>Has terminado este mundo. Puedes levantarte, beber agua y descansar un momento.</p><p class="muted">La siguiente puerta es '+areas[Q[state.i].area]+'. Tu progreso está guardado.</p><div class="actions"><button id="continue" class="primary">Seguir con el siguiente mundo →</button><button id="later">Continuar otro día</button></div></section>';bind('continue',render);bind('later',home);}
function finish(){const count=state.answers.filter(a=>a.ok===true).length,miss=Q.map((q,i)=>({q,i})).filter(x=>state.answers[x.i]?.ok===false);app.innerHTML='<div class="eyebrow">Las tres llaves reunidas</div><h1>¡Archivo abierto!</h1>'+map(-1)+'<section class="panel"><h2 id="title" tabindex="-1">20 retos completados</h2><p class="badge">'+count+' de 19 respuestas automáticas correctas</p><p class="muted">Y una anécdota escrita por ti, pendiente de revisar con un adulto.</p>'+areas.map((a,j)=>{const list=state.answers.filter((_,i)=>Q[i].area===j&&Q[i].type!=='write');return '<p>'+icons[j]+' '+a+': '+list.filter(s=>s.ok).length+'/'+list.length+(j===0?' + escritura':'')+'</p>';}).join('')+'<details><summary>Ver mi anécdota para revisarla juntos</summary><p id="story" class="context"></p><p>¿Se entiende lo que pasó? Comprueba las mayúsculas, los puntos y la enumeración con comas.</p></details></section><section class="panel"><h2>Lo que puedes afianzar</h2>'+(miss.length?miss.map(x=>'<details><summary>'+areas[x.q.area]+' · '+x.q.tag+'</summary><p>'+x.q.q+'</p><p>'+x.q.e+'</p></details>').join(''):'<p>¡Todas las respuestas automáticas correctas! Explica en voz alta cómo convertir centímetros en metros.</p>')+'<div class="actions"><a class="button primary" href="index.html">Volver al portal</a><button id="reset">Repetir la misión</button></div></section>';el('story').textContent=state.draft;bind('reset',reset);focus();}
home();
</script></body></html>
